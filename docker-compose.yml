services:
  train:
    build: .
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: python scripts/train_pipeline.py --n-trials 20
    profiles:
      - train

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
